name: Build Windows CUDA (3080)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows-cuda:
    runs-on: windows-2022  # 关键修改：使用 VS 2022 而非 VS 2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.4.0'
          method: 'network'

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: cmake -S . -B build -DGGML_CUDA=ON -DGGML_CUDA_FA_ALL_QUANTS=ON -DCMAKE_CUDA_ARCHITECTURES=86 -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_FLAGS="-allow-unsupported-compiler" -G "Ninja"

      - name: Build llama-server
        run: cmake --build build --config Release --target llama-server -j

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-windows-cuda86
          path: build/bin/
