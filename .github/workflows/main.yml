name: Build Windows CUDA (3080)

on:
  workflow_dispatch:  # 支持手动触发
  push:
    branches: [ main ]

jobs:
  build-windows-cuda:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.4.0'          # 与 3080 驱动兼容的稳定版本
          method: 'network'
          sub-packages: '["nvcc", "cudart"]'

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -S . -B build `
            -DGGML_CUDA=ON `
            -DGGML_CUDA_FA_ALL_QUANTS=ON `
            -DCMAKE_CUDA_ARCHITECTURES=86 `
            -DCMAKE_BUILD_TYPE=Release `
            -G "Ninja"

      - name: Build llama-server
        run: cmake --build build --config Release --target llama-server -j

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-windows-cuda86
          path: build/bin/llama-server.exe
